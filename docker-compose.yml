# =============================================================================
# AI Exam Engine — Docker Compose (Development)
# =============================================================================
# Services:
#   db        — PostgreSQL 15
#   redis     — Redis 7 (broker + cache + sessions)
#   backend   — Django/DRF application server
#   worker    — Celery worker (task consumer)
#   beat      — Celery beat (periodic task scheduler)
#   flower    — Celery monitoring dashboard
#   frontend  — Next.js dev server
# =============================================================================

services:
  # ─── Database ───────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - RUNNING_IN_DOCKER=true
      - POSTGRES_DB=exam_engine
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d exam_engine" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ─── Backend (Django) ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - RUNNING_IN_DOCKER=true
      - FRONTEND_URL=http://localhost:3000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/exam_engine
      - SQL_ENGINE=django.db.backends.postgresql
      - SQL_DATABASE=exam_engine
      - SQL_USER=postgres
      - SQL_PASSWORD=postgres
      - SQL_HOST=db
      - SQL_PORT=5432
      - DATABASE=postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - REDIS_SESSION_URL=redis://redis:6379/2
      - ALLOWED_HOSTS=0.0.0.0,localhost,127.0.0.1,backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Celery Workers ─────────────────────────────────────────────────
  summary_worker:
    build:
      context: ./backend
    command: celery -A core worker -Q normal,low -n summary_worker@%h --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - RUNNING_IN_DOCKER=true
      - DATABASE_URL=postgres://postgres:postgres@db:5432/exam_engine
      - SQL_ENGINE=django.db.backends.postgresql
      - SQL_DATABASE=exam_engine
      - SQL_USER=postgres
      - SQL_PASSWORD=postgres
      - SQL_HOST=db
      - SQL_PORT=5432
      - DATABASE=postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - REDIS_SESSION_URL=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "celery -A core inspect ping --timeout 10 2>/dev/null | grep -q 'OK'" ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  roadmap_worker:
    build:
      context: ./backend
    command: celery -A core worker -Q normal,maintenance -n roadmap_worker@%h --loglevel=info --pool=threads --concurrency=4
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - RUNNING_IN_DOCKER=true
      - DATABASE_URL=postgres://postgres:postgres@db:5432/exam_engine
      - SQL_ENGINE=django.db.backends.postgresql
      - SQL_DATABASE=exam_engine
      - SQL_USER=postgres
      - SQL_PASSWORD=postgres
      - SQL_HOST=db
      - SQL_PORT=5432
      - DATABASE=postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - REDIS_SESSION_URL=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "celery -A core inspect ping --timeout 10 2>/dev/null | grep -q 'OK'" ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  pdf_worker:
    build:
      context: ./backend
    command: celery -A core worker -Q high,normal -n pdf_worker@%h --loglevel=info --pool=threads --concurrency=4
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - RUNNING_IN_DOCKER=true
      - DATABASE_URL=postgres://postgres:postgres@db:5432/exam_engine
      - SQL_ENGINE=django.db.backends.postgresql
      - SQL_DATABASE=exam_engine
      - SQL_USER=postgres
      - SQL_PASSWORD=postgres
      - SQL_HOST=db
      - SQL_PORT=5432
      - DATABASE=postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - REDIS_SESSION_URL=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "celery -A core inspect ping --timeout 10 2>/dev/null | grep -q 'OK'" ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  analytics_worker:
    build:
      context: ./backend
    command: celery -A core worker -Q low,maintenance -n analytics_worker@%h --loglevel=info --pool=threads --concurrency=4
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - RUNNING_IN_DOCKER=true
      - DATABASE_URL=postgres://postgres:postgres@db:5432/exam_engine
      - SQL_ENGINE=django.db.backends.postgresql
      - SQL_DATABASE=exam_engine
      - SQL_USER=postgres
      - SQL_PASSWORD=postgres
      - SQL_HOST=db
      - SQL_PORT=5432
      - DATABASE=postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - REDIS_SESSION_URL=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "celery -A core inspect ping --timeout 10 2>/dev/null | grep -q 'OK'" ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  notification_worker:
    build:
      context: ./backend
    command: celery -A core worker -Q high -n notification_worker@%h --loglevel=info --pool=threads --concurrency=4
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - RUNNING_IN_DOCKER=true
      - DATABASE_URL=postgres://postgres:postgres@db:5432/exam_engine
      - SQL_ENGINE=django.db.backends.postgresql
      - SQL_DATABASE=exam_engine
      - SQL_USER=postgres
      - SQL_PASSWORD=postgres
      - SQL_HOST=db
      - SQL_PORT=5432
      - DATABASE=postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - REDIS_SESSION_URL=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "celery -A core inspect ping --timeout 10 2>/dev/null | grep -q 'OK'" ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ─── Celery Beat (Scheduler) ───────────────────────────────────────
  beat:
    build:
      context: ./backend
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - RUNNING_IN_DOCKER=true
      - DATABASE_URL=postgres://postgres:postgres@db:5432/exam_engine
      - SQL_ENGINE=django.db.backends.postgresql
      - SQL_DATABASE=exam_engine
      - SQL_USER=postgres
      - SQL_PASSWORD=postgres
      - SQL_HOST=db
      - SQL_PORT=5432
      - DATABASE=postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - REDIS_SESSION_URL=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "celery -A core inspect ping --timeout 10 2>/dev/null | grep -q 'OK' || exit 0" ]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ─── Flower (Celery Monitoring) ────────────────────────────────────
  flower:
    build:
      context: ./backend
    command: celery -A core flower --port=5555 --broker_api=redis://redis:6379/0 --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    ports:
      - "5555:5555"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - RUNNING_IN_DOCKER=true
      - FLOWER_USER=admin
      - FLOWER_PASSWORD=changeme
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      summary_worker:
        condition: service_started
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5555/healthcheck')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Frontend (Next.js) ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4005:4005"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
