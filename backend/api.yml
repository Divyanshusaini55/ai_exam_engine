openapi: 3.0.3
info:
  title: Aspirant AI API
  version: 1.0.0
  description: API documentation for the Aspirant AI backend
paths:
  /api/admin/contact-messages/:
    get:
      operationId: admin_contact_messages_retrieve
      description: |-
        Admin-only API endpoint to list all contact messages.
        Ordered by newest first.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/contact-messages/{message_id}/:
    delete:
      operationId: admin_contact_messages_destroy
      description: Admin-only API endpoint to delete a contact message.
      parameters:
      - in: path
        name: message_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/contact-messages/{message_id}/status/:
    patch:
      operationId: admin_contact_messages_status_partial_update
      description: Admin-only API endpoint to update message status (read/unread).
      parameters:
      - in: path
        name: message_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
