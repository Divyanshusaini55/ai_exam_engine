      description: |-
        GET /api/resources/<slug>/

        Returns the full detail of a single published resource.
        Atomically increments ``view_count`` via an ``F()`` expression on
        every GET so no read-back query is needed.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - resource-hub
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResourceDetail'
          description: ''
  /api/resource-hub/{slug}/bookmark/:
    post:
      operationId: resource_hub_bookmark_create
      description: |-
        POST /api/resources/<slug>/bookmark/

        Toggles the caller's ``ResourceBookmark`` for the given resource.
        Deletes the bookmark if it already exists, creates it otherwise.

        Requires authentication.

        Response
        --------
        200 OK
        {
            "is_bookmarked": true | false,
            "resource_slug": "<slug>"
        }
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - resource-hub
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/resource-hub/{slug}/mark-done/:
    post:
      operationId: resource_hub_mark_done_create
      description: |-
        POST /api/resources/<slug>/mark-done/

        Toggles the ``is_completed`` flag on the caller's ``ResourceProgress``
        record for the given resource.  Creates the record on first call.

        Requires authentication.

        Response
        --------
        200 OK
        {
            "is_completed": true | false,
            "resource_slug": "<slug>"
        }
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - resource-hub
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/resource-hub/topic/{topic_slug}/:
    get:
      operationId: resource_hub_topic_list
      description: |-
        GET /api/resources/topic/<topic_slug>/

        Returns all *published* resources belonging to the roadmap topic
        identified by ``topic_slug``, ordered by ``order`` then ``created_at``.

        The request object is forwarded to the serializer context so that
        per-user fields (``is_completed``, ``is_bookmarked``) are resolved
        correctly for authenticated callers.  Anonymous callers receive
        ``False`` for both fields.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: path
        name: topic_slug
        schema:
          type: string
        required: true
      tags:
      - resource-hub
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTopicResourceListList'
          description: ''
  /api/resources/:
    get:
      operationId: resources_list
      description: |-
        API endpoint for TopicResource.
        - List: published resources, filterable by ?topic=, ?resource_type=, ?difficulty=, ?search=, ?featured=
        - Retrieve: full resource including content + increments view_count
        - bookmark/: toggle bookmark (auth required)
        - complete/: toggle completed (auth required)
        - ai_summary/: generate Gemini summary (admin only)
      parameters:
      - name: page
        required: false
        in: query
