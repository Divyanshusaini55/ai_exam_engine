components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          description: URL-safe identifier (e.g. 'ssc')
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          description: Display name (e.g. 'SSC')
          maxLength: 100
        description:
          type: string
        icon:
          type: string
          description: Material Symbol name
          maxLength: 50
        icon_color:
          type: string
          description: Tailwind color name (e.g. 'blue', 'purple')
          maxLength: 20
        bg_color:
          type: string
          description: Tailwind background class
          maxLength: 50
        order:
          type: integer
          description: Display order (lower = first)
        is_active:
          type: boolean
          description: Show on frontend?
        exam_count:
          type: string
          readOnly: true
        subcategory_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - exam_count
      - id
      - name
      - slug
      - subcategory_count
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        question:
          type: integer
          nullable: true
        exam_id:
          type: integer
          readOnly: true
        exam_title:
          type: string
          readOnly: true
        solution:
          type: integer
          nullable: true
        parent:
          type: integer
          nullable: true
        text:
          type: string
        upvotes:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - exam_id
      - exam_title
      - id
      - text
      - user
      - username
    ContentFormatEnum:
      enum:
      - markdown
      - html
      - latex
      - plaintext
      - url
      type: string
      description: |-
        * `markdown` - Markdown
        * `html` - HTML
        * `latex` - LaTeX
        * `plaintext` - Plain Text
        * `url` - URL Only
    CorrectionSuggestion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        question:
          type: integer
        type:
          $ref: '#/components/schemas/CorrectionSuggestionTypeEnum'
        suggestion_data: {}
        note:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/CorrectionSuggestionStatusEnum'
          readOnly: true
        upvotes:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - question
      - status
      - suggestion_data
      - type
      - upvotes
      - user
      - username
    CorrectionSuggestionStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
    CorrectionSuggestionTypeEnum:
      enum:
      - question_text
      - correct_answer
      - option_text
      type: string
      description: |-
        * `question_text` - Question Text
        * `correct_answer` - Correct Answer
        * `option_text` - Option Text
    CurrentAffair:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 500
        slug:
          type: string
          maxLength: 600
          pattern: ^[-a-zA-Z0-9_]+$
        content:
          type: string
          description: Full summarized content from AI
        summary:
          type: string
          description: Short 2-sentence summary for list view
        category:
          type: integer
          nullable: true
        category_name:
          type: string
          readOnly: true
        image_url:
          type: string
          format: uri
          nullable: true
          maxLength: 1000
        source_name:
          type: string
          maxLength: 200
        source_url:
          type: string
          format: uri
          maxLength: 1000
        published_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category_name
      - content
      - created_at
      - id
      - slug
      - title
    DifficultyEnum:
      enum:
      - beginner
      - intermediate
      - advanced
      type: string
      description: |-
        * `beginner` - Beginner
        * `intermediate` - Intermediate
        * `advanced` - Advanced
    Exam:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          description: Exam title
          maxLength: 200
        description:
          type: string
        ai_summary:
          type: string
          nullable: true
          description: Markdown formatted AI summary
        subcategory:
          type: integer
          nullable: true
          description: Select the subcategory this exam belongs to
        subcategory_name:
          type: string
          readOnly: true
        category_name:
          type: string
          readOnly: true
        category_slug:
          type: string
          readOnly: true
        year:
          type: integer
          nullable: true
          description: Exam year (e.g., 2024)
        shift:
          type: string
          description: e.g., 'Shift 1', 'Morning', 'Afternoon'
          maxLength: 50
        status:
          allOf:
          - $ref: '#/components/schemas/ExamStatusEnum'
          description: |-
            Draft exams are not visible to students

            * `draft` - Draft
            * `published` - Published
            * `archived` - Archived
        duration_minutes:
          type: integer
        total_questions:
          type: integer
        marks_per_question:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
          description: Marks awarded for each correct answer
        total_marks:
          type: integer
          nullable: true
          description: Total marks for this exam
        question_count:
          type: integer
          readOnly: true
        supported_languages:
          description: Supported languages for this exam
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
          description: Inactive exams are hidden from students
      required:
      - category_name
      - category_slug
      - created_at
      - id
      - question_count
      - subcategory_name
      - title
    ExamRoadmap:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        subcategory:
          type: integer
        subcategory_name:
          type: string
          readOnly: true
        title:
          type: string
          description: e.g. 'Complete Syllabus for SSC CGL'
          maxLength: 200
        description:
          type: string
        phases:
          type: array
          items:
            $ref: '#/components/schemas/RoadmapPhase'
          readOnly: true
        is_bookmarked:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_bookmarked
      - phases
      - subcategory
      - subcategory_name
      - title
      - updated_at
    ExamStatusEnum:
      enum:
      - draft
      - published
      - archived
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `archived` - Archived
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          $ref: '#/components/schemas/NotificationTypeEnum'
        title:
          type: string
          maxLength: 200
        message:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
