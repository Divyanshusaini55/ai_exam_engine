      - updated_at
      - view_count
    TopicResourceDetail:
      type: object
      description: |-
        Full serializer for the single-resource reader / detail view.

        Extends ``TopicResourceListSerializer`` and adds:
        - ``ai_summary``, ``is_published``, ``order``, ``created_at``,
          ``updated_at``
        - ``content``                – rendered, sanitised content string
        - ``rendered_content_format`` – the format of the rendered content
          (``'html'``, ``'markdown'``, ``'url'``, or ``'plaintext'``)

        Raw source fields (``markdown_content``, ``html_content``,
        ``latex_content``) are **never** exposed by this serializer.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 500
        slug:
          type: string
          description: Auto-generated from title
          maxLength: 550
          pattern: ^[-a-zA-Z0-9_]+$
        short_description:
          type: string
          description: One-line summary shown in resource cards
        resource_type:
          allOf:
          - $ref: '#/components/schemas/ResourceTypeEnum'
          description: |-
            What kind of content is this?

            * `article` - Article
            * `markdown_note` - Markdown Note
            * `html_note` - HTML Note
            * `latex_note` - LaTeX Note
            * `video` - Video
            * `pdf` - PDF
            * `external_link` - External Link
            * `ai_note` - AI Note
            * `formula_sheet` - Formula Sheet
            * `quiz` - Quiz / Practice Set
        content_format:
          allOf:
          - $ref: '#/components/schemas/ContentFormatEnum'
          description: |-
            Primary content format for the reader to render

            * `markdown` - Markdown
            * `html` - HTML
            * `latex` - LaTeX
            * `plaintext` - Plain Text
            * `url` - URL Only
        difficulty:
          $ref: '#/components/schemas/DifficultyEnum'
        estimated_read_minutes:
          type: integer
          description: Estimated reading/watching time in minutes
        view_count:
          type: integer
          readOnly: true
          description: Auto-incremented on each API read
        is_featured:
          type: boolean
          description: Pinned/highlighted at top of the resource hub
        is_ai_generated:
          type: boolean
          description: True if content was generated by AI
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ResourceTag'
          readOnly: true
        thumbnail:
          type: string
          format: uri
          nullable: true
          description: Optional thumbnail image for resource cards
        is_completed:
          type: boolean
          description: |-
            Return ``True`` if the current user has a completed ``ResourceProgress``
            record for this resource.  Returns ``False`` for anonymous users.
          readOnly: true
        is_bookmarked:
          type: boolean
          description: |-
            Return ``True`` if the current user has bookmarked this resource.
            Returns ``False`` for anonymous users.
          readOnly: true
        ai_summary:
          type: string
          description: Short AI-generated summary shown as a callout in the article
            reader
        is_published:
          type: boolean
          description: Only published resources appear on the frontend
        order:
          type: integer
          description: Display order within the topic (lower = first)
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        content:
          type: string
          description: Return the rendered (and sanitised) content string.
          readOnly: true
        rendered_content_format:
          type: string
          description: |-
            Return the effective format of ``content`` after rendering.

            Possible values: ``'html'``, ``'markdown'``, ``'url'``,
            ``'plaintext'``.
          readOnly: true
      required:
      - content
      - created_at
      - id
      - is_bookmarked
      - is_completed
      - rendered_content_format
      - tags
      - title
      - updated_at
      - view_count
